<!doctype html><html><head><title>Amazon Sign-In</title></head><body>
<div id="a-page"><div class="a-section a-padding-medium auth-workflow"><div class="a-section a-spacing-none">
<form name="signIn" method="post" novalidate action="https://www.amazon.com.au/ap/signin" class="auth-validate-form auth-clearable-form">
<h1 class="a-spacing-small">Sign in</h1>
<label for="ap_email">Email or mobile phone number</label>
<input type="email" maxlength="128" id="ap_email" name="email" class="a-input-text a-span12 auth-autofocus auth-required-field">
<span id="continue" class="a-button a-button-span12 a-button-primary"><span class="a-button-inner"><input id="continue" class="a-button-input" type="submit" aria-labelledby="continue-announce"><span id="continue-announce" class="a-button-text" aria-hidden="true">Continue</span></span></span>
<div class="a-row a-spacing-top-medium"><span class="a-size-small">By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</span></div>
<a class="a-link-normal" href="#">Need help?</a>
</form>
<h5>New to Amazon?</h5>
<span id="createAccountSubmit" class="a-button a-button-span12"><span class="a-button-inner"><a class="a-button-text" href="#">Create your Amazon account</a></span></span>
</div></div></div></body></html>
