<!doctype html><html><head><title>Amazon.com.au</title></head><body>
<div class="a-container a-padding-double-large"><div class="a-row a-spacing-double-large">
<div class="a-box a-alert a-alert-info a-spacing-base"><div class="a-box-inner a-alert-container"><h4 class="a-alert-heading">Enter the characters you see below</h4><div class="a-alert-content">Sorry, we just need to make sure you're not a robot. For best results, please make sure your browser is accepting cookies.</div></div></div>
<form method="get" action="/errors/validateCaptcha" name="">
<h4>Type the characters you see in this image:</h4>
<div class="a-row a-text-center"><img src="https://images-na.ssl-images-amazon.com/captcha/xxx.jpg"></div>
<div class="a-row a-spacing-base"><div class="a-column a-span6"><input type="text" id="captchacharacters" name="field-keywords" class="a-span12" autocomplete="off" placeholder="Type characters" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
<div class="a-column a-span6 a-span-last a-text-right"><a onclick="window.location.reload()" class="a-link-normal">Try different image</a></div></div>
<span class="a-button a-button-primary a-span12"><span class="a-button-inner"><button type="submit" class="a-button-text">Continue shopping</button></span></span>
</form></div></div></body></html>
